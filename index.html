    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background, #fbfaf7);
        z-index: 9999;
      }

      #initial-loader .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      #initial-loader .loading-box {
        display: grid;
        grid-template-columns: repeat(3, 0.625rem);
        grid-template-rows: repeat(3, 0.625rem);
        gap: 0.25rem;
        padding: 0.75rem;
      }

      #initial-loader .loading-box span {
        background: var(--accent, #3d6fe0);
        animation: loadingBlink 1.2s steps(1) infinite;
      }

      #initial-loader .loading-box span:nth-child(1) {
        animation-delay: 0s;
      }

      #initial-loader .loading-box span:nth-child(2) {
        animation-delay: 0.1s;
      }

      #initial-loader .loading-box span:nth-child(3) {
        animation-delay: 0.2s;
      }

      #initial-loader .loading-box span:nth-child(4) {
        animation-delay: 0.3s;
      }

      #initial-loader .loading-box span:nth-child(5) {
        animation-delay: 0.4s;
      }

      #initial-loader .loading-box span:nth-child(6) {
        animation-delay: 0.5s;
      }

      #initial-loader .loading-box span:nth-child(7) {
        animation-delay: 0.6s;
      }

      #initial-loader .loading-box span:nth-child(8) {
        animation-delay: 0.7s;
      }

      #initial-loader .loading-box span:nth-child(9) {
        animation-delay: 0.8s;
      }

      @keyframes loadingBlink {
        0%,
        100% {
          opacity: 0.15;
        }

        50% {
          opacity: 1;
        }
      }

      #initial-loader .loading-label {
        margin: 0;
        color: var(--ink-soft, #3a3a3e);
        font-family: system-ui, sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.4;
        text-align: center;
        text-transform: uppercase;
      }

      #initial-loader.fade-out {
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CXtb93_s.js"></script>

      </div>
    </div>
